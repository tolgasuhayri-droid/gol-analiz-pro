
name: GOL ANALIZ PRO - Otomatik Analiz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,12,18 * * *'

permissions:
  contents: write

jobs:
  analiz:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kutuphaneleri kur
        run: pip install requests
      
      - name: Analiz motorunu test et
        run: python test_analiz.py
      
      - name: Mac analizini calistir
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python analiz.py

      - name: Tahminleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json team_cache.json
          git diff --cached --quiet || git commit -m "Tahminleri guncelle"
          git pull --rebase origin main
          git push origin main
